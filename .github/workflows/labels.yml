# Creates or updates every label of .github/labels.json, which the forms and the triage apply: a form adds only a
# label that exists. It deletes none. It needs no secret and writes to issues alone.
name: labels
on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: create or update each label of the file
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -c '.[]' .github/labels.json | while read -r label; do
            gh label create "$(jq -r .name <<< "$label")" --force \
              --color "$(jq -r .color <<< "$label")" --description "$(jq -r .description <<< "$label")"
          done
